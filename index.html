<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Travel Explorer helps you discover countries, explore destinations, save favorites, and compare countries."
    />

    <title>Travel Explorer | Discover Your Next Destination</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <header id="main-header"></header>

    <main>
      <section class="hero">
        <h1>Explore the World</h1>
        <p>Discover countries and find your next destination.</p>

        <form id="search-form">
          <label for="country-search">Search for a country</label>
          <input
            type="search"
            id="country-search"
            name="country"
            placeholder="Enter a country name"
            required
          />
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="results-section">
        <h2>Explore Destinations</h2>

        <div id="search-message"></div>

        <div id="destination-results" class="destination-grid"></div>
      </section>
    </main>
    <footer id="main-footer"></footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/search.js"></script>
  </body>
</html>
